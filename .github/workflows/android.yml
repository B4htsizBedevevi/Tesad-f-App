name: Android Build

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: tesaduf-android-build
  cancel-in-progress: true

env:
  ORG_GRADLE_PROJECT_supabasePublishableKey: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Gradle
        run: |
          curl -fsSL https://services.gradle.org/distributions/gradle-8.9-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /opt
          echo "/opt/gradle-8.9/bin" >> "$GITHUB_PATH"

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: tesaduf-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
